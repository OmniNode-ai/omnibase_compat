---
schema_version: "1.0.0"
ticket_id: "OMN-20074"
title: "Repo-owned DoD evidence caller for omnibase_compat, and the S6 cut-over of its OCC callers"
summary: "omnibase_compat owns its DoD evidence contract and delegates verification to the receipt-gate
  reusable in caller-evidence mode. After the S6 cut-over the caller enforces (shadow false) without comparing
  with OCC, and no OCC caller, OCC job or OCC required context remains. Focused tests check the base-branch
  caller wiring, the immutable pin, the enforcing inputs, the absence of OCC callers and this contract."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-repo-evidence-gate"
    statement: |-
      omnibase_compat must wire a base-branch caller evidence gate that runs beside OCC in shadow mode, and bind every repo-owned acceptance criterion to runnable test evidence.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: omnibase_compat carries a caller workflow for the receipt-gate's caller-evidence mode that runs from the base branch (pull_request_target) on dev and main with read-only permissions and no secrets -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k base_branch
      - id: "AC2"
        statement: |-
          AC2: the caller pins the reusable by the full sha of the omnibase_core#1914 squash commit, the pin omnibase_core's own caller uses, with a verifier-version of 0.4.305 or later -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k current_receipt_gate
      - id: "AC13"
        statement: |-
          AC13: the runner-IP caller pins omniclaude#2656 at a45ba68f053e9979c6edef21103c0e674e5f7630, whose reusable runs both scans without OCC preflight, and has no job condition or dependency -- falsifier: uv run pytest tests/ci/test_ban_hardcoded_runner_ip_scope.py -q
      - id: "AC5"
        statement: |-
          AC5: every acceptance criterion of this contract names a falsifier that is also a dod_evidence check and runs an existing test file -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k falsifier_per_criterion
  - id: "req-precommit-hooks-from-core"
    statement: |-
      omnibase_compat's no-untracked-todos pre-commit hooks come from omnibase_core, which exports them under the same hook ids, instead of from onex_change_control, with every exclude and setting unchanged.
    acceptance:
      - id: "AC6"
        statement: |-
          AC6: .pre-commit-config.yaml declares no-untracked-todos once each, in an omnibase_core block pinned to a full commit sha, with each exclude and setting unchanged and no onex_change_control block -- falsifier: uv run pytest tests/ci/test_precommit_hooks_core_omn20074.py -q
  - id: "req-contract-validation-from-core"
    statement: |-
      omnibase_compat's contract-validation workflow validates the branch ticket's contract with omnibase_core's ModelTicketContract at an exact pinned version instead of with the onex_change_control validators, and keeps the required context name contract-validation.
    acceptance:
      - id: "AC8"
        statement: |-
          AC8: .github/workflows/contract-validation.yml names no onex_change_control repository or validate-yaml command, checks out only the calling repository, and keeps the workflow name Contract Validation and the single job contract-validation -- falsifier: uv run pytest tests/ci/test_contract_validation_core_validator_omn20074.py -q -k "change_control or calling_repository or required_context"
      - id: "AC9"
        statement: |-
          AC9: the workflow's validation step installs omnibase-core at one exact version at or above 0.47.39 and validates the branch ticket's contract with ModelTicketContract.model_validate, skipping when the branch names no ticket or no contract exists and failing when the contract is invalid -- falsifier: uv run pytest tests/ci/test_contract_validation_core_validator_omn20074.py -q -k validation_step
  - id: "req-s6-comparison-off"
    statement: |-
      omnibase_compat's repo-evidence caller on dev stops comparing with OCC before the S6 change removes the OCC producer the comparison reads.
    acceptance:
      - id: "AC10"
        statement: |-
          AC10: the dev caller passes compare-with-occ "false" and keeps shadow "true", the full-sha reusable pin and every other input unchanged -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k "disables_occ_comparison or match_the_merge_base"
  - id: "req-s6-cutover-no-occ-callers"
    statement: |-
      omnibase_compat retires its OCC callers and contexts and enforces repo-owned evidence without comparing with OCC.
    acceptance:
      - id: "AC11"
        statement: |-
          AC11: no event-triggered workflow calls an OCC reusable or waits on occ-preflight, the OCC caller workflows (call-occ-autobind.yml, call-occ-companion-effect.yml, call-receipt-gate.yml, occ-autobind-mint-verify.yml) and scripts/ci/occ_manual_replay_precheck.py are gone, ci.yml has no contract-compliance job and CI Summary waits on none, and the required-checks manifest names no OCC context -- falsifier: uv run pytest tests/ci/test_no_occ_callers_omn20074.py -q
      - id: "AC12"
        statement: |-
          AC12: the repo-evidence caller enforces (shadow "false"), does not compare with OCC (compare-with-occ "false"), and pins receipt-gate.yml@4e4f5e0404d364e296c5d37db6aa3ab9e07f8ffa with verifier-version 0.4.310 -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k "disables_occ_comparison or s6_caller_enforces"
  - id: "req-schema-gate-name"
    statement: |-
      omnibase_compat's ticket-contract schema compatibility gate is named for what it checks, not for change control, and stays required.
    acceptance:
      - id: "AC14"
        statement: |-
          AC14: the schema-compat job in onex-schema-compat.yml is named ONEX Ticket Contract Schema Compatibility, and the required-checks manifest names the same context as REQUIRED with no entry under the old change-control name -- falsifier: uv run pytest tests/ci/test_schema_compat_job_name_omn20074.py -q
evidence_requirements:
  - kind: "tests"
    description: "The caller workflow has the required base-branch trigger and read-only permissions."
    command: "uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k base_branch"
  - kind: "tests"
    description: "The caller pins the current receipt-gate by full sha."
    command: "uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k current_receipt_gate"
  - kind: "tests"
    description: "Every criterion of this contract is bound to a runnable check."
    command: "uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k falsifier_per_criterion"
  - kind: "tests"
    description: "Migrated hooks sit in an omnibase_core block at a full sha, excludes unchanged."
    command: "uv run pytest tests/ci/test_precommit_hooks_core_omn20074.py -q"
  - kind: "tests"
    description: "The contract-validation workflow names no change-control repository and keeps its context
      name."
    command: 'uv run pytest tests/ci/test_contract_validation_core_validator_omn20074.py -q -k "change_control
      or calling_repository or required_context"'
  - kind: "tests"
    description: "The contract-validation step validates with ModelTicketContract at an exact omnibase_core
      pin."
    command: 'uv run pytest tests/ci/test_contract_validation_core_validator_omn20074.py -q -k validation_step'
  - kind: "tests"
    description: "The caller no longer compares with OCC and keeps every other input and the pin."
    command: 'uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k "disables_occ_comparison
      or match_the_merge_base"'
  - kind: "tests"
    description: "The S6 cut-over removes OCC callers, preflight dependencies and OCC required contexts."
    command: "uv run pytest tests/ci/test_no_occ_callers_omn20074.py -q"
  - kind: "tests"
    description: "The repo-evidence caller enforces repo-owned evidence without comparing with OCC at
      the S6 pins."
    command: 'uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k "disables_occ_comparison
      or s6_caller_enforces"'
  - kind: "tests"
    description: "The schema compatibility job and its required-checks entry carry the ticket-contract
      name."
    command: "uv run pytest tests/ci/test_schema_compat_job_name_omn20074.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
