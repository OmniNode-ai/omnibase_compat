---
schema_version: "1.0.0"
ticket_id: "OMN-21291"
title: "omnibase_compat holds the 1 ticket contract moved from onex_change_control by omnibase_compat#244,
  each checked by a test"
summary: >-
  omnibase_compat#244 moves one ticket contract into contracts/. A focused test asserts that each moved
  contract is present, loads as a mapping and names its own ticket, and this contract binds that test
  to both criteria.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-moved-contracts-checked"
    statement: >-
      Each ticket contract moved into omnibase_compat by omnibase_compat#244 is checked by a test, and
      the pull request carries a contract of its own that binds that test.
    acceptance:
      - id: "AC1"
        statement: >-
          AC1: a test in omnibase_compat fails when any contract moved by omnibase_compat#244 is absent
          from contracts/ or does not parse as a ticket contract, and passes at the PR head -- falsifier:
          uv run pytest over the moved-contract test at the merge base (fails) and at the head (passes)
      - id: "AC2"
        statement: >-
          AC2: omnibase_compat#244 is titled with this ticket and carries contracts/<this ticket>.yaml
          whose dod_evidence binds AC1 -- falsifier: repo-evidence / dod-verify verdict at the PR head
          plus uv run pytest of the bound test
evidence_requirements:
  - kind: "tests"
    description: "Every moved contract is present in contracts/, loads as a mapping and names its ticket."
    command: "uv run pytest tests/ci/test_moved_ticket_contracts_omn21291.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-moved-contracts-present-ac1"
    description: "The moved-contract test fails at the merge base and passes at the head."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_moved_ticket_contracts_omn21291.py -q"
    binds_ac: ["AC1"]
  - id: "dod-moved-contracts-bound-ac2"
    description: "This contract binds the moved-contract test for the PR that carries it."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_moved_ticket_contracts_omn21291.py -q -k OMN-19642"
    binds_ac: ["AC2"]
