---
schema_version: 1.0.0
ticket_id: OMN-17427
title: omnibase_compat runs its CI on GitHub-hosted runners only
summary: 'Operator RULING 2026-10-16T07:07:09Z: "Ci runners should be for private repos only." omnibase_compat
  is public, so six workflow jobs that fell back to the self-hosted omnibase-ci fleet now run on the literal
  label ubuntu-latest, and omnibase_core''s check-public-runner-placement runs as a CI Summary required
  job and as a pre-commit hook at one core release, installed isolated because this repository forbids
  a core dependency.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-public-runner-placement
    statement: Every workflow job in omnibase_compat runs on a literal GitHub-hosted label, and the omnibase_core
      placement check refuses a job added back that does not.
    acceptance:
      - id: AC1
        statement: 'AC1: no workflow names the self-hosted fleet or computes a runs-on label from a variable,
          the Public Runner Placement job is unconditional, hosted, carries a positive control and the
          same core release as the pre-commit hook, and CI Summary requires its success -- falsifier:
          uv run pytest tests/ci/test_public_runner_placement_omn17427.py -q fails at the merge base,
          where six workflow jobs fall back to the omnibase-ci fleet and neither the job nor the hook
          exists'
  - id: req-runner-fleet-wire-models
    statement: The runner-fleet observation wire models live in omnibase_compat so the emitter and the
      projection consumer share one wire shape.
    acceptance:
      - id: AC2
        statement: 'AC2: ModelRunnerFleetObservationWire, ModelRunnerObservationWire and EnumRunnerStatus
          import from omnibase_compat, accept a fleet observation, refuse a status outside online/busy/offline
          and carry COMPAT_MIGRATION_TARGET and COMPAT_REMOVAL_DATE -- falsifier: uv run pytest tests/unit/test_runner_fleet_observation_wire.py
          -q fails at the merge base, where the modules do not exist'
  - id: req-dev-merge-tag
    statement: 'Operator RULING 2026-10-16T09:35:49Z: tags replace releases, made automatic. omnibase_compat,
      a sibling other platform repositories consume, tags every push to dev with a lightweight dev-<UTC
      YYYYMMDDHHMMSS>-<sha12> tag on the pushed commit, idempotent per commit, with no tag on any other
      ref, so a consumer pins it through a uv git source instead of a sha, a branch, a release or an exact
      version.'
    acceptance:
      - id: AC3
        statement: 'AC3: .github/workflows/dev-merge-tag.yml triggers only on push to dev, and its tag
          step, run against a throwaway repository with a +05:30 committer date, pushes one lightweight
          tag named dev-<committer time in UTC>-<sha12> at the commit, pushes nothing on a second run
          or when a dev tag for that sha already exists, pushes nothing in a dry run, and refuses a value
          that is not a full sha -- falsifier: uv run pytest tests/ci/test_dev_merge_tag_workflow_omn17427.py
          -q fails at the merge base, where the workflow does not exist'
evidence_requirements:
  - kind: tests
    description: The placement tests read every workflow file for the fleet fallback and a computed runs-on,
      the ci.yml job, .pre-commit-config.yaml and the CI Summary wiring.
    command: uv run pytest tests/ci/test_public_runner_placement_omn17427.py -q
  - kind: tests
    description: The wire model tests validate a fleet observation, refuse out-of-set statuses and empty
      required strings, and read the retention comments.
    command: uv run pytest tests/unit/test_runner_fleet_observation_wire.py -q
  - kind: tests
    description: The dev merge tag tests run the workflow's own tag step against a throwaway repository
      and a local bare remote.
    command: uv run pytest tests/ci/test_dev_merge_tag_workflow_omn17427.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
