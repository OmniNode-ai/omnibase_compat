---
schema_version: "1.0.0"
ticket_id: "OMN-19998"
title: "omnibase_compat tags every dev merge so consumers pin a tag, not a release"
summary: "Every push to dev gets a lightweight dev-<UTC>-<sha12> tag, the same mechanism omnimarket and
  omnibase_infra already run."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-omn19998-omnibase_compat-dev-merge-tag"
    statement: "Operator RULING 2026-10-16T09:35:49Z: tags replace releases, made automatic. omnibase_compat,
      a sibling another platform repository consumes, tags every push to dev with a lightweight dev-<UTC
      YYYYMMDDHHMMSS>-<sha12> tag on the pushed commit, idempotent per commit, with no tag on any other
      ref, so a consumer can pin it through a uv git source."
    acceptance:
      - id: "AC1"
        statement: "AC1: .github/workflows/dev-merge-tag.yml triggers only on push to dev, and its tag
          step, run against a throwaway repository with a +05:30 committer date, pushes one lightweight
          tag named dev-<committer time in UTC>-<sha12> at the commit, pushes nothing on a second run
          or when a dev tag for that sha already exists, pushes nothing in a dry run, and refuses a value
          that is not a full sha -- falsifier: uv run pytest tests/ci/test_dev_merge_tag_workflow_omn19998.py
          -q fails at the merge base, where the workflow does not exist"
evidence_requirements:
  - kind: "tests"
    description: "The dev merge tag workflow's own tag step runs against a throwaway repository."
    command: "uv run pytest tests/ci/test_dev_merge_tag_workflow_omn19998.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn19998-omnibase_compat-dev-merge-tag"
    description: "The dev merge tag tests pass at the head; at the merge base the workflow file does not
      exist and every test fails."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_dev_merge_tag_workflow_omn19998.py -q"
        cwd: "${OMNI_HOME}/omnibase_compat"
    binds_ac: ["AC1"]
  - id: "dod-omn19998-omnibase_compat-dev-merge-tag-deploy-probe"
    description: "Hosted-runner probe reads the dev merge tag workflow at this commit and requires its
      push-to-dev trigger and its tag push; the base has no such file and the probe fails."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          gh api "repos/OmniNode-ai/omnibase_compat/contents/.github/workflows/dev-merge-tag.yml?ref=$(git
          rev-parse HEAD)" --jq .content | base64 -d | awk '/branches: \[dev\]/{a=1} /git push origin
          "refs\/tags\//{b=1} END{exit !(a&&b)}'
        cwd: "."
