---
repos:
  # YAML formatting (standard across ecosystem, OMN-4862)
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
        exclude: ^\.github/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  # Cross-repo enforcement hooks from onex_change_control
  - repo: https://github.com/OmniNode-ai/onex_change_control
    rev: 8d7e85bc00e7f1b1306d1cb40949be1ab6e7e91a
    hooks:
      - id: no-untracked-todos
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: validate-spdx-headers
        name: ONEX SPDX Header Requirement
        entry: bash scripts/validate_spdx_headers.sh
        language: system
        pass_filenames: true
        files: ^(src|tests|scripts|examples)/.*\.py$
        exclude: ^(archived/|archive/)
        stages: [pre-commit]

      # --------------------------------------------------------------------------
      # mypy Type Checking (OMN-4863, ONEX ecosystem parity)
      # Matches the ecosystem standard from omnibase_core
      # --------------------------------------------------------------------------
      - id: mypy-type-check
        name: mypy (type checking - strict)
        entry: bash -c 'uv run mypy "$@" --show-error-codes --no-error-summary' --
        language: system
        types: [python]
        files: ^src/omnibase_compat/.*\.py$
        pass_filenames: true
        stages: [pre-push]

      # No-infra-edge invariant (OMN-12599, durability-plan Task 3.1).
      # compat must validate without resolving/installing omnibase_infra; this
      # guard scans pyproject + uv.lock for any omnibase_infra/core/spi edge and
      # fails fast when one appears. Runs on every commit so a dependency edge
      # cannot slip in via pyproject or a re-lock.
      - id: compat-no-infra-edge
        name: compat no-infra-edge gate (OMN-12599)
        entry: python scripts/check_no_infra_edge.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: check-dep-provenance
        name: Forbid first-party git-source overrides (OMN-13873)
        entry: uv run --frozen python scripts/check_dep_provenance.py
        language: system
        files: ^pyproject\.toml$
        pass_filenames: false
        stages: [pre-commit]

      - id: normalization-symmetry
        name: normalization-symmetry
        entry: python -m omnibase_core.validation.checker_normalization_symmetry src
        language: python
        additional_dependencies:
          - "omnibase-core @ git+https://github.com/OmniNode-ai/omnibase_core.git@187871b3c3c84cc4c876781c6f160c0fde378978"
        pass_filenames: false

      # OMN-14350: non-canonical lifecycle-class ratchet (fan-out). compat forbids a
      # core dep (compat-no-infra-edge gate), so — exactly like normalization-symmetry
      # above — it runs the core validator via an isolated additional_dependencies
      # git-pin, NOT a pyproject/uv.lock edge. rev MUST be a specific core SHA
      # (post-#1430-merge dev HEAD); the HOLD placeholder below stays until the real
      # SHA is set and this PR is opened.
      - id: no-noncanonical-lifecycle-classes
        name: Non-canonical lifecycle-class ratchet (OMN-14350)
        entry: python -m omnibase_core.validators.no_noncanonical_lifecycle_classes --allowlist .onex_ratchets/noncanonical_class_allowlist.yaml
          src/omnibase_compat
        language: python
        additional_dependencies:
          - "omnibase-core @ git+https://github.com/OmniNode-ai/omnibase_core.git@63635097705d832e0ee9c4811093efb31349105c"
        pass_filenames: false
        stages: [pre-commit]

      # Skip-token rejection gate (OMN-11412 / OMN-10414)
      # Blocks [skip-*] bypass tokens in staged markdown/yaml/txt files.
      # Escape hatch: add '# skip-token-allowed: <receipt-id>' with a traceable approval receipt.
      - id: reject-deploy-gate-skip-token
        name: Reject skip-gate bypass tokens (OMN-10414)
        entry: .pre-commit-hooks/reject-deploy-gate-skip-token.sh
        language: script
        pass_filenames: true
        always_run: true
        stages: [pre-commit]
        exclude: ^tests/.*fixtures/
      - id: reject-deploy-gate-skip-token-commit-msg
        name: Reject skip-gate bypass tokens in commit messages (OMN-10414)
        entry: .pre-commit-hooks/reject-deploy-gate-skip-token.sh
        language: script
        pass_filenames: true
        stages: [commit-msg]

      # OMN-14669 (WS7 fan-out #6, canary OMN-14655): CI<->pre-commit byte-match
      # parity gate. Two local meta-gates over this very file, wired as BOTH
      # pre-commit hooks (here) and an unconditional, standalone CI workflow
      # (.github/workflows/precommit-parity-gate.yml) in this same PR so the
      # false-green class cannot regenerate on the next wrapper script
      # (feedback_a_rule_is_not_a_mechanism / CLAUDE.md Rule #5).
      #
      # Fail-loud meta-gate: hard-rejects the exit-0-on-missing-path /
      # WARN-SKIP-degrade class (a skipped gate must be byte-indistinguishable
      # from a failing one) plus any hook `stages:` value that
      # default_install_hook_types does not install (DRIFT-2 / DRIFT-2a).
      - id: precommit-fail-loud-meta-gate
        name: Pre-commit fail-loud meta-gate (OMN-14669)
        entry: uv run python scripts/validation/validate_precommit_fail_loud.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        files: ^(\.pre-commit-config\.yaml|scripts/.*\.(sh|py)|\.pre-commit-hooks/.*\.sh)$
      # Pin-parity ratchet: fails closed the moment the pre-commit omnibase_core
      # SHA the no-noncanonical-lifecycle-classes hook pins (via
      # additional_dependencies) diverges from the SHA ci.yml's own
      # no-noncanonical job pins for the same validator (DRIFT-3). See PIN_PAIRS
      # in the script for the verified pair.
      - id: precommit-pin-parity
        name: Pre-commit/CI pin-parity check (OMN-14669)
        entry: uv run python scripts/validation/validate_precommit_pin_parity.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        files: ^(\.pre-commit-config\.yaml|\.github/workflows/ci\.yml)$
      # OMN-15241: Required-Check Skip-Vector Guard (canary OMN-14854) -- LOCAL
      # parity for a guard this repo already runs CI-only via
      # .github/workflows/required-check-skip-guard-caller.yml. Without this hook a
      # skip-vector violation commits with every local hook GREEN and is caught only
      # after push -- detection without local enforcement (root CLAUDE.md Rule #5).
      #
      # Fails closed when a workflow file or the required-checks manifest introduces
      # any of the five skip vectors on a REQUIRED context: a path-scoped trigger, an
      # ungated job-level `if:`, an ungated reusable-caller `if:`, a missing
      # pull_request/merge_group trigger, or a `needs:` with no `if:` that provably
      # runs regardless of the needs result (OMN-15057 vector 5).
      #
      # The wrapper executes the SAME validator the CI reusable workflow executes
      # (canonical copy in omniclaude, resolved via $OMNI_HOME), so local and CI
      # verdicts cannot diverge on validator logic.
      - id: reject-required-check-skip-vector
        name: Reject skip vectors on required-check workflows (OMN-15241)
        entry: .pre-commit-hooks/reject-required-check-skip-vector.sh
        language: script
        pass_filenames: false
        files: '^\.github/(workflows/.*\.ya?ml|required-checks\.yaml)$'
        stages: [pre-commit]
      # OMN-15541: test-root collection guard. This repo has TWO pytest roots
      # (src/omnibase_compat/tests and tests) and three surfaces used to name
      # different subsets of them -- ci.yml's full-suite step hardcoded
      # `pytest src/omnibase_compat/tests/` while the selector returned
      # ["tests/"], DISJOINT lists, so every fail-closed escalation collected
      # 141 tests and none of the 277 under tests/ (the OMN-15373 policy gate
      # among them). pyproject `testpaths` is now the single source of truth;
      # this hook fails closed if a positional path returns to the full-suite
      # step, if the selector stops reading testpaths, if a tests/ dir is added
      # outside every declared root, or if a declared root is not on disk.
      # Same guard shape as omnibase_infra's OMN-15410. Also runs in CI inside
      # the required `validate` job -- local and CI execute the same script.
      - id: validate-test-root-collection
        name: Test-root collection guard (OMN-15541)
        entry: uv run --frozen python scripts/validation/validate_test_root_collection.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        files: ^(pyproject\.toml|\.github/workflows/ci\.yml|scripts/ci/detect_test_paths\.py|.*/tests/.*)$

  # ---------------------------------------------------------------------------
  # OMN-16664: a workflow may not execute a repo-local script that is absent.
  #
  # The OMN-15017 fan-out copied call-occ-autobind.yml and
  # call-occ-companion-effect.yml here without carrying
  # scripts/ci/occ_manual_replay_precheck.py, which both of them run, so every
  # manual OCC replay dispatched in this repo died at [Errno 2] before the
  # precheck could decide anything. Local parity for the "Workflow Script
  # Reference Gate" CI job: without this hook the break commits with every
  # local hook green and is caught only after push (root CLAUDE.md Rule #5).
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: workflow-script-refs
        name: Workflow-referenced repo-local scripts exist (OMN-16664)
        entry: uv run python tests/ci/test_workflow_script_refs_exist.py
        language: system
        pass_filenames: false
        files: ^(\.github/workflows/.*\.ya?ml|scripts/.*)$
        stages: [pre-commit]

# Configuration
# OMN-14669 (DRIFT-2a fix): every stage a hook uses MUST be installed by
# `pre-commit install`. Previously [pre-commit, pre-push] only, so the
# reject-deploy-gate-skip-token-commit-msg hook (stages:[commit-msg]) silently
# never installed locally — a false-green. The precommit-fail-loud-meta-gate
# above now fails closed if this drifts again.
default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit]
fail_fast: false
