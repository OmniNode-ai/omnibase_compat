name: CI

on:
  push:
    branches: [main, dev, "hotfix/**"]
  pull_request:
    branches: [main, dev]
  merge_group:
    branches: [main, dev]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"  # 06:17 UTC nightly

env:
  UV_VERSION: "0.8.3"
  PYTHON_VERSION: "3.12"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --dev --frozen
      - run: uv run python scripts/validate_no_upstream_deps.py
      # No-infra-edge invariant (OMN-12599, durability-plan Task 3.1):
      # compat must validate without resolving/installing omnibase_infra. The
      # guard scans pyproject + the frozen uv.lock closure only (no network,
      # no install) and fails the gate if an omnibase_infra/core/spi edge
      # appears. uv sync --dev --frozen above proves the closure resolved with
      # infra absent; this step asserts that invariant explicitly.
      - name: Compat no-infra-edge gate (OMN-12599)
        run: uv run python scripts/check_no_infra_edge.py
      - run: uv run python scripts/check_compat_retention.py
      # OMN-15541: test-root collection guard. Lives in the REQUIRED `validate`
      # context (not in the test job) so it cannot itself be skipped by the
      # very test-selection defect it guards -- a guard reachable only through
      # the selector would be unreachable exactly when the selector is broken.
      # Fails closed on a positional path in the full-suite pytest step, a
      # selector that stops deriving its roots from pyproject `testpaths`, a
      # tests/ dir outside every declared root, or a declared root missing from
      # disk. Same script the pre-commit hook runs.
      - name: Test-root collection guard (OMN-15541)
        run: uv run python scripts/validation/validate_test_root_collection.py
      - run: uv run ruff check src/
      - run: uv run mypy src/omnibase_compat --strict
      - run: uv build
      - run: uv pip install dist/*.whl

  # ---------------------------------------------------------------------------
  # Detect Changes — OMN-10761 smart test selection
  # ---------------------------------------------------------------------------
  detect-changes:
    name: Detect Changes
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      is_full_suite: ${{ steps.detect.outputs.is_full_suite }}
      full_suite_reason: ${{ steps.detect.outputs.full_suite_reason }}
      split_count: ${{ steps.detect.outputs.split_count }}
      matrix: ${{ steps.detect.outputs.matrix }}
      selected_paths: ${{ steps.detect.outputs.selected_paths }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - run: uv sync --dev --frozen

      - name: Compute changed files
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "$base" || true
            git diff --name-only "$base"...HEAD > changed.txt
          else
            git diff --name-only HEAD~1 HEAD > changed.txt || echo "" > changed.txt
          fi
          echo "Changed files:"
          cat changed.txt

      - name: Resolve test selection
        id: detect
        env:
          FLAG: ${{ vars.ENABLE_SMART_TESTS == 'true' && 'on' || 'off' }}
        run: |
          uv run python -m scripts.ci.detect_test_paths \
            --changed-files-from changed.txt \
            --ref-name "${{ github.ref_name }}" \
            --event-name "${{ github.event_name }}" \
            --feature-flag "$FLAG" \
            > selection.json
          cat selection.json
          is_full=$(jq -r '.is_full_suite' selection.json)
          reason=$(jq -r '.full_suite_reason // ""' selection.json)
          split_count=$(jq -r '.split_count' selection.json)
          matrix=$(jq -c '.matrix' selection.json)
          paths=$(jq -c '.selected_paths' selection.json)
          echo "is_full_suite=$is_full" >> "$GITHUB_OUTPUT"
          echo "full_suite_reason=$reason" >> "$GITHUB_OUTPUT"
          echo "split_count=$split_count" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "selected_paths=$paths" >> "$GITHUB_OUTPUT"

      - name: Upload selection artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-selection
          path: selection.json
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Tests — matrix driven by detect-changes
  # ---------------------------------------------------------------------------
  test-parallel:
    name: Tests (Split ${{ matrix.split }}/${{ needs.detect-changes.outputs.split_count }})
    needs: [validate, detect-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        split: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - run: uv sync --dev --frozen

      - name: Run pytest (smart selection)
        if: vars.ENABLE_SMART_TESTS == 'true' && needs.detect-changes.outputs.is_full_suite == 'false'
        run: |
          paths=$(echo '${{ needs.detect-changes.outputs.selected_paths }}' | jq -r '.[]')
          uv run pytest $paths \
            --splits ${{ needs.detect-changes.outputs.split_count }} \
            --group ${{ matrix.split }} \
            --tb=short \
            --junitxml=junit-${{ matrix.split }}.xml

      - name: Run pytest (full suite)
        if: vars.ENABLE_SMART_TESTS != 'true' || needs.detect-changes.outputs.is_full_suite == 'true'
        # OMN-15541: NO positional path is passed to pytest here, deliberately.
        # This step used to say `uv run pytest src/omnibase_compat/tests/`,
        # which made this workflow — not pyproject.toml — the real definition of
        # "the full suite". A positional path overrides `testpaths` entirely, so
        # every fail-closed escalation (MAIN_BRANCH, MERGE_GROUP, SHARED_MODULE,
        # TEST_INFRASTRUCTURE, THRESHOLD_MODULES, FEATURE_FLAG_OFF, SCHEDULED)
        # collected 141 tests and ZERO of the 277 under the top-level `tests/`
        # tree — including tests/unit/test_omn_15373_no_ungated_linear_done_policy.py
        # and tests/unit/test_no_infra_edge.py. The escalation that exists to be
        # the safety net when narrowing cannot be proven safe was collecting
        # strictly LESS than the narrow fallback.
        #
        # With no positional argument pytest inherits `testpaths` from
        # pyproject.toml verbatim, so there is exactly one place to add a root.
        # scripts/validation/validate_test_root_collection.py fails closed if a
        # positional path is re-introduced here. Use --ignore to exclude,
        # never a positional include. Same fix as omnibase_infra's OMN-15410.
        run: |
          uv run pytest \
            --splits ${{ needs.detect-changes.outputs.split_count }} \
            --group ${{ matrix.split }} \
            --tb=short \
            --junitxml=junit-${{ matrix.split }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.split }}
          path: junit-${{ matrix.split }}.xml
          retention-days: 7

  tests-gate:
    name: Tests Gate
    needs: test-parallel
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate test results
        run: |
          result="${{ needs.test-parallel.result }}"
          echo "test-parallel: $result"

          # OMN-15315 (OMN-15304 vector 6 — result triage). The previous pass
          # condition was `"$result" == "success" || "$result" == "skipped"`,
          # which rendered this REQUIRED context green on a SKIPPED upstream.
          # `skipped` is the ABSENCE of a verdict exactly like `cancelled`, and
          # it is precisely the state a conditional `if:` or a needs-cascade
          # produces — so vector 5 and vector 6 composed into a bypass: strand
          # `test-parallel`, and the gate that was supposed to catch it reports
          # green with no test result in existence.
          #
          # PER-UPSTREAM SKIP POLICY: `test-parallel` carries no job-level `if:`
          # and its matrix is never empty (scripts/ci/detect_test_paths.py
          # always emits split_count >= 1, falling back to `tests/`), so it can
          # only be skipped by a non-success `validate` / `detect-changes`
          # upstream — a state that must fail this gate, not pass it. The policy
          # table is therefore empty: every non-`success` value fails closed,
          # including an unrecognised future result value (`*`).
          case "$result" in
            success)
              echo "Tests Gate: PASSED ($result)"
              ;;
            failure)
              echo "::error::Tests Gate FAILED — test-parallel reported failure."
              exit 1
              ;;
            cancelled|skipped)
              echo "::error::Tests Gate FAILED — test-parallel produced no verdict (result: $result); the absence of a test result is not a passing one."
              exit 1
              ;;
            *)
              echo "::error::Tests Gate FAILED — unrecognised test-parallel result '$result'; failing closed."
              exit 1
              ;;
          esac

  contract-compliance:
    name: Contract Compliance Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Clone onex_change_control
        run: git clone --depth=1 https://github.com/OmniNode-ai/onex_change_control.git /tmp/onex_change_control
      - name: Install onex_change_control and dependencies
        # Install the cloned OCC package so `from onex_change_control.integrations`
        # resolves. OCC depends on omnibase-core (on PyPI) + pyyaml + pydantic.
        # OCC commit 7c1a5cc64 added this import to run_contract_compliance_check.py;
        # the prior step only installed pyyaml, breaking any PR opened after that commit.
        run: pip install /tmp/onex_change_control
      - name: Resolve PR number
        id: pr_number
        run: |
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            echo "pr=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            # merge_group: ref is gh-readonly-queue/main/pr-<num>-<sha>
            PR=$(echo "${{ github.ref }}" | grep -oP '(?<=pr-)\d+' || true)
            echo "pr=$PR" >> "$GITHUB_OUTPUT"
          fi
      - name: Run contract compliance check
        if: steps.pr_number.outputs.pr != ''
        run: |
          python /tmp/onex_change_control/scripts/ci/run_contract_compliance_check.py \
            --pr ${{ steps.pr_number.outputs.pr }} \
            --repo ${{ github.repository }} \
            --contracts-dir /tmp/onex_change_control/contracts \
            --workspace /tmp/onex_change_control
        env:
          EMERGENCY_BYPASS: ${{ secrets.EMERGENCY_BYPASS || '' }}
          GH_TOKEN: ${{ github.token }}

  no-noncanonical-lifecycle-classes:
    name: no-noncanonical-lifecycle-classes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.3"
      - name: Ratchet non-canonical lifecycle-word classes against frozen allowlist (OMN-14350)
        run: |
          uv run --no-project \
            --with 'omnibase-core @ git+https://github.com/OmniNode-ai/omnibase_core@63635097705d832e0ee9c4811093efb31349105c' \
            python -m omnibase_core.validators.no_noncanonical_lifecycle_classes \
            --check-stale \
            --allowlist .onex_ratchets/noncanonical_class_allowlist.yaml \
            src/omnibase_compat

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [validate, tests-gate, contract-compliance, no-noncanonical-lifecycle-classes]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          # OMN-14350: strict fail-closed gate on the non-canonical lifecycle-class
          # ratchet - only 'success' passes; skipped/cancelled/failure ALL block. It is
          # in needs: so this job WAITS for it (no race).
          if [[ "${{ needs.no-noncanonical-lifecycle-classes.result }}" != "success" ]]; then
            echo "::error::no-noncanonical-lifecycle-classes ratchet did not pass (result: ${{ needs.no-noncanonical-lifecycle-classes.result }}) - fail-closed (OMN-14350)"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled"
            exit 1
          fi
          echo "All required jobs passed"
