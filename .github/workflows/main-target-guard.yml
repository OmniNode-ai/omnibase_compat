#
# OMN-12243: Block PRs targeting main unless they are promotion PRs
# from dev with a promotion receipt.
# OMN-12477: Removed the hotfix/* bypass — main accepts only dev promotions.

name: Main target guard

on:
  pull_request:
    types: [opened, edited, synchronize]

# OMN-19642: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  main-target-guard:
    name: main-target-guard
    # OMN-17427: this repository is public, so its CI runs on GitHub-hosted runners only
    # (RULING 2026-10-16T07:07:09Z); check-public-runner-placement refuses any runs-on that is not a literal hosted label.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check PR target branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          if [[ "${BASE_REF}" != "main" ]]; then
            echo "::notice::PR targets '${BASE_REF}', not main; guard does not apply."
            exit 0
          fi

          echo "PR targets main. Checking head ref: '${HEAD_REF}'"

          if [[ "${HEAD_REF}" == "dev" ]]; then
            if echo "${PR_BODY}" | grep -qE 'promotion-receipt:[[:space:]]*OCC-[0-9]+'; then
              echo "::notice::Promotion PR from dev with valid promotion-receipt. Allowed."
              exit 0
            fi

            echo "::error::PR is from dev but is missing a promotion receipt."
            echo "::error::Add a line matching: promotion-receipt: OCC-<number>"
            echo "::error::Retarget this PR to dev; main accepts only promotion PRs."
            exit 1
          fi

          echo "::error::PRs targeting main must come from dev."
          echo "::error::Head ref '${HEAD_REF}' is not permitted to target main directly."
          echo "::error::Retarget this PR to dev; main accepts only promotion PRs."
          exit 1
