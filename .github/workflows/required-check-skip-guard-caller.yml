#
# Required-Check Skip-Vector Guard — local caller for omnibase_compat's PRs.
# OMN-14858 (fan-out from OMN-14854 omniclaude canary — first fan-out repo).
#
# Invokes the omniclaude-hosted reusable workflow (validate_no_required_check_
# skip_vectors.py) against .github/required-checks.yaml (schema v3) on every
# PR and merge_group entry.
#
# Produces required status check: "required-check-skip-guard / check-skip-vectors"
#
# NOT YET added to required_status_checks on this branch. This file's manifest
# row for this context carries `mode: ADVISORY`. The branch-protection flip to
# REQUIRED happens in a follow-up PR only after this workflow has posted green
# on `dev` at least twice — never in the same PR that introduces the workflow,
# to avoid a self-inflicted wedge (a PR blocked on a required check that has
# never successfully run under real conditions). Same ordering OMN-14854 used
# for the omniclaude canary.
#
# IMPORTANT: this trigger MUST NOT carry a `paths:`/`paths-ignore:` filter
# (design spec section 4c). This is the one required-check workflow that is
# exempt from "narrow the trigger for efficiency" — a path filter here would
# be the exact self-referential skip-vector this guard exists to catch.

name: Required-Check Skip-Vector Guard

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, dev]
  merge_group:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  required-check-skip-guard:
    uses: OmniNode-ai/omniclaude/.github/workflows/required-check-skip-guard-reusable.yml@main
