#
# Caller workflow: invokes the reusable receipt-gate on every PR targeting main.
#
# Receipt-gate (omnibase_core) enforces "Enforcement by Receipt" (OMN-10483):
# every PR must cite a Linear ticket whose dod_evidence items all have PASS
# ModelDodReceipt artifacts in onex_change_control. Missing or failing receipts
# block merge.
#
# Required-status-check name: `verify / verify`

name: Receipt Gate

on:
  pull_request:
    # OMN-19512: ready_for_review re-runs the gate on the draft flip, so a
    # draft-era red (companion declined while the PR is a draft) is refreshed.
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main, dev]
  merge_group:
    branches: [main, dev]

# OMN-19642: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    # OMN-20001: pinned sha, bump via a PR that integration-tests the new sha
    uses: OmniNode-ai/omnibase_core/.github/workflows/receipt-gate.yml@fad21c40911b356c30f3e38c9075332f11524617  # omnibase_core#1853 (OMN-20375): validator ref accepts ModelDodReceipt.artifact_sha256
    with:
      branch-policy-mode: ${{ (github.event.pull_request.base.ref == 'main' || github.event.merge_group.base_ref == 'refs/heads/main') && 'main-release' || 'legacy' }}
