# shim-ttl-gate.yml
#
# CI gate: fail if any forward-compat shim has a past-TTL sunset annotation.
# Implements OMN-8820.

name: Shim TTL Gate

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev, "hotfix/**"]

# OMN-19642: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  shim-ttl-gate:
    name: Shim TTL Gate
    # OMN-17427: this repository is public, so its CI runs on GitHub-hosted runners only
    # (RULING 2026-10-16T07:07:09Z); check-public-runner-placement refuses any runs-on that is not a literal hosted label.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.21"

      - name: Install package
        run: uv sync --dev

      - name: Check shim TTLs
        run: uv run python -m omnibase_compat.tooling.shim_ttl_check src/
