name: docs-validate

on:
  pull_request:
  push:
    branches: [main, dev, "hotfix/**"]

# OMN-19642: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  call:
    # OMN-20001: pinned sha, bump via a PR that integration-tests the new sha
    uses: OmniNode-ai/omnibase_core/.github/workflows/validate-docs.yml@52851458622f368c3b596c82bf810bc6acce1d5e
    with:
      standalone: true
