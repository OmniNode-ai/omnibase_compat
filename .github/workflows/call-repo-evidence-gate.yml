#
# Repo Evidence Gate caller (OMN-20074, OR.6) verifies
# omnibase_compat's own contracts/<OMN-N>.yaml at the PR head through
# omnibase_core's receipt-gate reusable with evidence-source: caller.
# This is the path omnimarket proved as the canary (OMN-20070, OMN-20072).
#
# Why pull_request_target: GitHub reads the workflow definition from the BASE
# branch, so a pull request that edits this file or the reusable's pin does not
# change which definition runs on it. The pull request's own code is only ever
# checked out as data by the reusable, which refuses fork heads.
#
# dev and main are the integration branches. The activity types cover new heads,
# reopened and ready PRs, and edits to the ticket citation or base branch.
# Per-PR concurrency cancels superseded runs so the latest event gets a verdict.
# Read-only contents and pull-requests permissions are all this caller needs;
# checkout and verification belong to the reusable, with no caller secrets.
# The full-SHA pin makes the reusable immutable; verifier-version pins the
# released verifier used to read the caller's contracts.
#
# The job id is the context prefix: repo-evidence / dod-verify carries the
# verdict, so do not add a job name. The reusable also reports a
# repo-evidence / verify job as a success no-op; only repo-evidence / dod-verify
# carries a verdict.
#
# OMN-20074: this caller enforces repo-owned evidence with shadow "false".
# repo-evidence / dod-verify is to be required by a dev ruleset, with no row in
# required-checks.yaml.
#
# The reusable is pinned by full SHA to the squash commit of omnibase_core#1983
# on dev. It descends from #1974, which leaves caller evidence as the reusable's
# only mode, so the retired comparison input is no longer passed (the reusable
# defaults it to "false" and fails dod-verify on any other value), and from
# #1932. omnibase_compat does not host receipt-gate.yml.
#
# The pinned reusable refuses a verifier-version below 0.4.303 before installing
# it (VERIFIER_FLOOR, omnibase_core#1932; OMN-20032). With shadow "false" that
# refusal blocks.

name: Repo Evidence Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  repo-evidence:
    uses: OmniNode-ai/omnibase_core/.github/workflows/receipt-gate.yml@b192b64626e8aba609a261b3bec2e19b353195a1 # OMN-20074: immutable full-SHA pin, the squash commit of omnibase_core#1983 on that repo's dev branch; descends from #1974 (caller evidence is the only mode) and #1932 (VERIFIER_FLOOR 0.4.303 refusal in the verifier install step)
    with:
      evidence-source: caller
      verifier-version: 0.4.310
      shadow: "false"
